name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mirrors the local closing gate exactly:
#   ruff check . · facade-isolation grep · pyright src/lha · uv run pytest · uv run lha eval (5/5)
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (+ Python 3.11 from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Facade isolation (CocoIndex must not leak out of live_context)
        run: |
          if grep -rnE "^[[:space:]]*(import|from)[[:space:]]+(cocoindex|cocoindex_code)" \
               --include='*.py' src/lha | grep -v "src/lha/live_context/"; then
            echo "::error::CocoIndex import leaked outside the live_context facade"
            exit 1
          fi
          echo "facade isolation: clean"

      - name: Type-check (pyright)
        run: uv run pyright src/lha

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Cache embedding model (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Self-eval (lha eval, expects 5/5)
        run: uv run lha eval

  docker:
    # Proves the container actually builds. Build only — no push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lha:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image (CLI + context extra present)
        run: |
          docker run --rm lha:ci lha --version
          docker run --rm lha:ci python -c "import lha, cocoindex, sentence_transformers"
      - name: Set up uv (+ Python 3.11 from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Docker execution-backend tests (real containers)
        run: |
          uv sync
          LHA_DOCKER_TESTS=1 uv run pytest tests/test_sandbox.py -q
