name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mirrors the local closing gate exactly:
#   ruff check . · facade-isolation grep · pyright src/lha · uv run pytest · uv run lha eval (6/6)
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up uv (+ Python 3.11 from .python-version)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Published benchmark claims match committed evidence
        run: uv run python -m lha.release_claims

      # This also requires the evaluated commit to be an ancestor of HEAD.
      # A squash merge that drops that commit therefore fails closed.
      - name: Reproduce Terminal-Bench evaluated source wheel
        run: |
          uv run python tools/verify_terminal_source_build.py \
            --root . \
            --evidence benchmarks/terminal_bench_2_1

      - name: Facade isolation (CocoIndex must not leak out of live_context)
        run: |
          if grep -rnE "^[[:space:]]*(import|from)[[:space:]]+(cocoindex|cocoindex_code)" \
               --include='*.py' src/lha | grep -v "src/lha/live_context/"; then
            echo "::error::CocoIndex import leaked outside the live_context facade"
            exit 1
          fi
          echo "facade isolation: clean"

      - name: Type-check (pyright)
        run: uv run pyright src/lha

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Build wheel and source distribution
        run: |
          uv build --clear
          unzip -l dist/*.whl | grep 'lha/live_context/flows/common.py'
          unzip -l dist/*.whl | grep 'lha/bench/resources/terminal_bench_2_1_corpus.json'
          tar -tf dist/*.tar.gz | grep 'src/lha/live_context/flows/common.py'
          tar -tf dist/*.tar.gz | grep 'src/lha/bench/resources/terminal_bench_2_1_corpus.json'

      - name: Smoke-test wheel and source distribution outside the checkout
        run: |
          ROOT="$PWD"
          CORPUS_CHECK='
          from lha.bench.terminal_bench import load_terminal_bench_corpus
          corpus = load_terminal_bench_corpus()
          assert corpus.dataset == "terminal-bench/terminal-bench-2-1"
          assert len(corpus.tasks) == 89
          assert corpus.resolution_failures == ()
          '
          WHEEL_TMP="$(mktemp -d)"
          cd "$WHEEL_TMP"
          uv run --no-project --with "$ROOT"/dist/*.whl lha --version
          uv run --no-project --with "$ROOT"/dist/*.whl \
            python -c "from lha.live_context.flows import common, experiments_flow, papers_flow, skills_flow"
          uv run --no-project --with "$ROOT"/dist/*.whl python -c "$CORPUS_CHECK"
          uv run --no-project --with "$ROOT"/dist/*.whl lha eval --quick
          SDIST_TMP="$(mktemp -d)"
          cd "$SDIST_TMP"
          uv run --no-project --with "$ROOT"/dist/*.tar.gz lha --version
          uv run --no-project --with "$ROOT"/dist/*.tar.gz \
            python -c "from lha.live_context.flows import common, experiments_flow, papers_flow, skills_flow"
          uv run --no-project --with "$ROOT"/dist/*.tar.gz python -c "$CORPUS_CHECK"
          uv run --no-project --with "$ROOT"/dist/*.tar.gz lha eval --quick

      - name: Cache embedding model (HuggingFace)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Self-eval (lha eval, expects 6/6)
        run: uv run lha eval

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Set up uv (+ Python 3.11 from .python-version)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Static checks
        run: |
          uv run ruff check .
          uv run pyright src/lha
      - name: Tests
        run: uv run pytest -q
      - name: Self-eval
        run: LHA_RUNS_DIR=runs/_macos uv run lha eval

  docker:
    # Proves the container actually builds. Build only — no push.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: lha:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image (CLI + context extra present)
        run: |
          docker run --rm lha:ci lha --version
          docker run --rm lha:ci git --version
          docker run --rm lha:ci python -c "import lha, cocoindex, sentence_transformers"
          docker run --network none --rm lha:ci lha eval
          docker run --rm lha:ci python -c "from pathlib import Path; assert not any((Path('/app') / p).exists() for p in ('.env', '.codex', '.claude', '.agents', '.mcp.json', 'auth.json', '.ssh', '.aws', '.config/gcloud', '.netrc', '.pypirc', 'dist'))"
      - name: Build and inspect Terminal-Bench broker image
        run: |
          docker build \
            --file docker/terminal-bench-proxy.Dockerfile \
            --tag lha-terminal-proxy:ci \
            .
          test "$(docker image inspect --format '{{.Config.User}}' lha-terminal-proxy:ci)" = "65532:65532"
          docker run --rm --entrypoint python lha-terminal-proxy:ci \
            -c "from lha.bench import terminal_proxy_server"
      - name: Set up uv (+ Python 3.11 from .python-version)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Docker execution-backend tests (real containers)
        run: |
          uv sync
          LHA_DOCKER_TESTS=1 LHA_DOCKER_TEST_IMAGE=lha:ci \
            uv run pytest tests/test_sandbox.py -q
