[project]
name = "lha"
version = "0.4.2.dev0"
description = "A resumable task runner with executable checks for code and experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "liuqjjin", email = "156533013+liuqjjin@users.noreply.github.com" }]
keywords = [
    "llm-agents",
    "agent-harness",
    "verification",
    "llm-evals",
    "research-agent",
    "langgraph",
    "reproducibility",
    "ablation",
    "swe-bench",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2.6",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.28.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-json-report>=1.5.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.18",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
# The doc/experiment/skill vector index is optional: without it, those context
# backends report "unavailable" and required-context steps fail closed.
context = [
    "cocoindex>=1.0.11",
    "sentence-transformers>=5.6.0",
    "torch>=2.11.0",
]
# Public-benchmark harnesses. harbor needs Python >= 3.12 (lha itself runs on 3.11).
bench = ["swebench>=4.1.0", "harbor>=0.20; python_version >= '3.12'"]
llm = ["anthropic>=0.69"]  # needs the Opus-4.8 surface (adaptive thinking, output_config.effort)
typecheck = ["pyright>=1.1"]

[project.urls]
Homepage = "https://github.com/liuqjjin/long-horizon-agent"
Repository = "https://github.com/liuqjjin/long-horizon-agent"
Issues = "https://github.com/liuqjjin/long-horizon-agent/issues"
Changelog = "https://github.com/liuqjjin/long-horizon-agent/blob/main/CHANGELOG.md"

[project.scripts]
lha = "lha.cli:main"

[tool.ruff]
line-length = 100
exclude = ["runs", "data", ".cocoindex_code", "src/lha/live_context/flows/_scratch"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src/lha"]
exclude = ["src/lha/resources/eval/sample_repo"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
# dev installs the context extra's packages so the doc-context tests run for real.
dev = [
    "cocoindex>=1.0.11",
    "pyright>=1.1.410",
    "pytest-cov>=7.1.0",
    "sentence-transformers>=5.6.0",
]
