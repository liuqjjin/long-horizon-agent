[project]
name = "lha"
version = "0.2.0"
description = "A verification-first long-horizon agent harness for code, papers, and experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Long-Horizon Research Agent contributors" }]
keywords = [
    "llm-agents",
    "agent-harness",
    "verification",
    "llm-evals",
    "research-agent",
    "langgraph",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "cocoindex>=1.0.11",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.28.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-json-report>=1.5.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.18",
    "scikit-image>=0.26.0",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
# scikit-image / numpy / cocoindex are already core deps; the only genuinely
# optional backends are the Anthropic SDK and the pyright type-checker.
llm = ["anthropic>=0.69"]  # needs the Opus-4.8 surface (adaptive thinking, output_config.effort)
typecheck = ["pyright>=1.1"]

[project.scripts]
lha = "lha.cli:main"

[tool.ruff]
line-length = 100
exclude = ["runs", "data", ".cocoindex_code", "flows/_scratch"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src/lha"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest-cov>=7.1.0",
]
