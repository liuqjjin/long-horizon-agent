schema_version: 1
allowed_tools: [python, pytest, ruff]
setup:
  - id: setup-python
    tool: python
    args: ["--version"]
baseline:
  - id: baseline-tests
    tool: pytest
    args: ["-q"]
    expected_returncodes: [1]
reproduce:
  - id: reproduce-json
    tool: pytest
    args: ["-q", "tests/test_cli.py::test_json_output_is_one_machine_readable_document"]
    expected_returncodes: [1]
targeted:
  - id: targeted-cli
    tool: pytest
    args: ["-q", "tests/test_cli.py"]
full:
  - id: full-tests
    tool: pytest
    args: ["-q"]
lint:
  - id: lint
    tool: ruff
    args: ["check", "src", "tests"]
build:
  - id: build
    tool: python
    args: ["-m", "compileall", "-q", "src"]
cleanup: []

