schema_version: 1
allowed_tools: [python, pytest, ruff]
setup:
  - id: setup-python
    tool: python
    args: ["--version"]
baseline:
  - id: baseline-tests
    tool: pytest
    args: ["-q"]
    expected_returncodes: [1]
reproduce:
  - id: reproduce-seed
    tool: pytest
    args: ["-q", "tests/test_repro.py::test_same_seed_reproduces_raw_values_and_manifest"]
    expected_returncodes: [1]
targeted:
  - id: targeted-repro
    tool: pytest
    args: ["-q", "tests/test_repro.py"]
full:
  - id: full-tests
    tool: pytest
    args: ["-q"]
lint:
  - id: lint
    tool: ruff
    args: ["check", "src", "tests"]
build:
  - id: build
    tool: python
    args: ["-m", "compileall", "-q", "src"]
cleanup: []

