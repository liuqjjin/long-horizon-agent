kind: issue_to_pr
title: "LRUCache evicts a key that was just read"
description: >
  With capacity 2: put(a), put(b), get(a), put(c) evicts a even though a was
  read most recently; b should have been evicted instead.
target_repo: data/bench/lru
inputs:
  context_query: "LRU cache eviction recency"
success:
  - "pytest passes"
  - "ruff clean"
